name: Bug report
description: Report a reproducible problem in this repository.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Please use English and include enough detail that somebody else can reproduce the problem.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Short description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What exact steps lead to the problem?
      placeholder: |
        1. Start ...
        2. Open ...
        3. Click ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware / environment
      description: Include robot hardware, Pi/CM4 details, controller, camera, battery, etc. if relevant.
      placeholder: Describe the hardware and runtime environment.
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots / media
      description: Paste logs or link screenshots/video if you have them.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I used English
          required: true
        - label: I searched existing Issues and Discussions first
          required: true
        - label: This is a repository bug, not a general build-help question
          required: true
