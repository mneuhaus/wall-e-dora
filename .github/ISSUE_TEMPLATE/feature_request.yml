name: Feature request
description: Suggest a concrete improvement for this repository.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea.

        Please use English and keep the request tied to the actual repository, not just a general brainstorming thought.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is missing or painful today?
      placeholder: Describe the problem this feature would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see added or changed?
      placeholder: Describe the feature request.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider?
      placeholder: Optional alternatives or workarounds.
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Add links, sketches, hardware notes, screenshots, or anything else useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I used English
          required: true
        - label: I searched existing Issues and Discussions first
          required: true
        - label: This request is specific enough to be actionable in the repo
          required: true
